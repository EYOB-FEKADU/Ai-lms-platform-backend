version: '3.8'

services:
  backend:
    build: .
    container_name: lms-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: "no"
    volumes:
      - ./src:/app/src
      - /app/node_modules